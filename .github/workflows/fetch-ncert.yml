name: Auto Fetch and Compile NCERT

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly trigger
  workflow_dispatch: # Manual UI trigger

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pypdf

    - name: Run NCERT Downloader and Compiler Script
      run: python fetch_ncert.py

    - name: Upload Single Compiled Document
      uses: actions/upload-artifact@v4
      with:
        name: complete-compiled-ncert
        path: compiled_ncert_library.pdf
        retention-days: 14
